{{ define "main" }}
<article class="single-page">
  <header class="page-header">
    <div class="container text-center">
      <span class="section-label">{{ .Section | title }}</span>
      <h1 style="font-size:3rem;margin-top:0.5rem;">{{ .Title }}</h1>
      <p style="font-family:var(--font-mono);font-size:0.875rem;color:var(--primary);margin-top:0.75rem;">{{ .Date.Format "January 2, 2006" }}</p>
    </div>
  </header>

  <section style="padding-bottom:5rem;">
    <div class="container prose">
      {{ .Content }}
    </div>
  </section>

  <div style="padding-bottom:5rem;text-align:center;">
    <a href="{{ .Parent.RelPermalink }}" class="btn-outline">&larr; Back to {{ .Parent.Title }}</a>
  </div>
</article>
{{ end }}
